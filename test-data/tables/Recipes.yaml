- Id: 0
  Name: Biscotti
  Instructions: >-
    Mix flour, sugar, baking powder, salt in shortening.  Add eggs and milk and
    mix thoroughly.  Mix in chocolate chips.  Break dough into small pieces,
    roll to form 1 1/2" to 2" length thin rolled pieces.  Shape into an "S."
    Place on cookie sheets 3/4" apart.  Bake at 375°F 12-15 mins. or until
    lightly brown.
- Id: 1
  Name: Cheese Straws
  ServingQuantity: 120
  Instructions: >-
    Heat oven to 350°F.  In mixer bowl, beat butter, salt, and pepper until
    creamy.  Add cheese and mix well.  Gradually add flour, mixing until
    dough begins to form a ball.  Form dough ball with hands.  Fit cookie press
    with small star plate; fill with dough according to manufacturer''s
    directions.  Press dough onto cookie sheets in 3-inch-long strips.  Bake
    12 minutes or until lightly browned.  Cool completely on wire rack.  Store
    tightly covered.
- Id: 2
  Name: Grilled Banana Splits
  ServingQuantity: 4
  Instructions: "
    1. Prepare grill for direct cooking\n
    2. Cut unpeeled bananas length-wise; brush melted butter over cut sides.
    Grill bananas, cut side down over medium-hot coals 2 minutes or until
    lightly browned; turn.  Grill 2 minutes or until tender.\n
    3. Combine syrup + liquer, if desired, in small bowl.\n
    4. Cut bananas in half crosswise; carefully remove peel.  Place 2 pieces
    banana in each bowl; top with 1/3 cup of ice cream, 1 tablespoon
    chocolate syrup, and 1/4 of nuts; serve immediately."
- Id: 3
  Name: Cheddar Tomato Bacon Toasts
  ServingQuantity: 2
  Instructions: "
    1. Preheat oven to 350°F. In a medium bowl, combine cheese sauce, tomato, and bacon.\n
    2. On a baking sheet, arrange slices of bread and apply the combined mixture to them.\n
    3. Bake until the mixture begins to bubble (about 10 minutes)."
- Id: 4
  Name: Giugiulene
  ServingQuantity: 1
  Instructions: >-
    Heat oven to 375°F. Have two or more baking parchment-covered
    cookie sheets ready. Sift or combine within a food processor: flour, salt, sugar,
    and baking powder. Add the butter to the mixture. Once combined, it will be a fine
    powder. Make a separate combination of eggs, vanilla, and slowly beat in 1/3 cup of
    milk. Once mixed, begin running the food processor again, and slowly combine. The
    dough may need additional milk to form an adequately dense ball. Portion the dough,
    then in roll sesame seeds. Bake for 12 minutes.
- Id: 5
  Name: Cream Puffs
  ServingQuantity: 1
  Instructions: >-
    Preheat oven to 400°F. Unfold pastry on lightly floured surface; roll pastry out to
    10-inch square. Cut out 9 circles with 3-inch diameter. Place on ungreased baking sheet,
    and bake for 10 minutes. Remove, and transfer to wire racks, then cool completely. Separately,
    combine milk, pudding mix, then beat with wire whisk until well-blended (about 2 minutes). Add
    whipped topping, then cover and refrigerate for 5 minutes. Cut pastry segments in half, fill
    with the filling, and drizzle with chocolate. Can be served immediately or refrigerated.
- Id: 6
  Name: New Potatoes in Dill Sauce
  ServingQuantity: 4
  Instructions: >-
    Microwave potatoes and water covered in microwave for 10 minutes. Stir. Put the
    potatoes back in for 5-7 minutes, or until they become tender; drain. Separately,
    microwave cream cheese and milk for a minute, then stir until smooth. Pour the
    mixture over the potatoes and top with dill. Microwave for 2 minutes, and then
    stir, letting stand for 3 minutes until ready to serve.
- Id: 7
  Name: Peanut Butter Fingers
  Instructions: >-
    Combine creamed butter, sugar, brown sugar. Add egg, peanut butter, baking soda, salt,
    and vanilla. Add flour, then roll into a greased 9x13 pan. Bake at 350°F for 25 minutes.
    Sprinkle chocolate chips over the dough while it''s still hot, then let it melt to be spread
    over the dough. Combine sugar, peanut butter, and milk. Mix well. drizzle peanut butter
    mixture over the top, and cut into bars.
- Id: 8
  Name: Double Cheese Pasta Primavera
  ServingQuantity: 4
  Instructions: >-
    Prepare boxed dinner as instructed. Heat dressing in skillet on medium heat.
    Add broccoli and peppers; cook and stir for 5 minutes, until the vegetables are
    crisp and tender. Stir in peas; cook until they''re heated through. Add prepared
    dinner and basil; mix lightly. Top with parmesan cheese.
- Id: 9
  Name: Spinach Pasta Toss
  Instructions: >-
    Combine tomatoes, pasta, and water in a saucepan, and bring it to a boil, stirring
    the whole time. Cover, and simmer for 10 minutes. Uncover, and then simmer for an
    additional minute, until the pasta is tender. Add half the spinach and simmer until
    the leaves are wilted. Repeat for the next half, then finally serve topped with cheese.
- Id: 10
  Name: Yeast-free pizza dough
  Instructions: >-
    Preheat oven to 425°F. Combine and stir all ingredients in a large bowl until they begin
    to form a ball of dough. Knead the dough in the bowl until it''s smooth. Form into a ball,
    then press into an oiled pizza pan or onto a baking sheet. Place toppings on the pizza
    and bake for about 30 minutes.
- Id: 11
  Name: Mediterranean marinated vegetable salad
  Instructions: >-
    Toss tomatoes, peppers, zucchini, and onions in a large bowl. Combine dressing, basil,
    and garlic. Pour it over the vegetable mixture, and toss to coat everything. Add cheese;
    mix lightly, and refrigerate for 1 hour
- Id: 12
  Name: Cheese manicotti
  ServingQuantity: 7
  Instructions: >-
    Preheat oven to 350°F. Cook mushrooms and garlic in a greased skillet for five minutes on medium
    heat, stirring frequently, then remove from heat. In a medium bowl, beat egg whites. Then, add
    mushroom mixture, spinach, ricotta, and half of each Mozzarella and Parmesan cheeses; mix well.
    Then load into manicotti shells. Place the shells in a 9x13 greased pan, and cover shells with
    pasta sauce. Bake for 40 minutes, or until heated through. Top with the remaining cheeses,
    then bake until melted (about 5 minutes).
- Id: 13
  Name: Southwest layered salad
  Instructions: >-
    Place lettuce into serving bowl, and layer with corn, salsa, beans, and cheese. Drizzle with
    dressing and add crushed chips. Toss well, then it''s ready to serve.
