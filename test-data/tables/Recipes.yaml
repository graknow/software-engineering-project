- ID: 0
  Name: Biscotti
  Instructions: >-
    Mix flour, sugar, baking powder, salt in shortening.  Add eggs and milk and
    mix thoroughly.  Mix in chocolate chips.  Break dough into small pieces,
    roll to form 1 1/2" to 2" length thin rolled pieces.  Shape into an "S."
    Place on cookie sheets 3/4" apart.  Bake at 375° 12-15 mins. or until
    lightly brown.
- ID: 1
  Name: Cheese Straws
  ServingQuantity: 12
  Instructions: >-
    Heat oven to 350°F.  In mixer bowl, beat butter, salt, and pepper until
    creamy.  Add cheese and mix well.  Gradually add flour, mixing until
    dough begins to form a ball.  Form dough ball with hands.  Fit cookie press
    with small star plate; fill with dough according to manufacturer''s
    directions.  Press dough onto cookie sheets in 3-inch-long strips.  Bake
    12 minutes or until lightly browned.  Cool completely on wire rack.  Store
    tightly covered.
- ID: 2
  Name: Grilled Banana Splits
  ServingQuantity: 4
  Instructions: "
    1. Prepare grill for direct cooking\n
    2. Cut unpeeled bananas length-wise; brush melted butter over cut sides.
    Grill bananas, cut side down over medium-hot coals 2 minutes or until
    lightly browned; turn.  Grill 2 minutes or until tender.\n
    3. Combine syrup + liquer, if desired, in small bowl.\n
    4. Cut bananas in half crosswise; carefully remove peel.  Place 2 pieces
    banana in each bowl; top with 1/3 cup of ice cream, 1 tablespoon
    chocolate syrup, and 1/4 of nuts; serve immediately."
