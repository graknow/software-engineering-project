  Name: Chocolate Chip Cookie (Server)
  Instructions: >-
    Mix flour, brown sugar, baking powder, salt in shortening.  Add eggs and milk and
    mix thoroughly.  Mix in chocolate chips.  Break dough into small pieces,
    roll to form 1 1/2" to 2" length thin rolled pieces.  Shape into an "S."
    Place on cookie sheets 3/4" apart.  Bake at 375°F 12-15 mins. or until
    lightly brown.